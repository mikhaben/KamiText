# cbindgen configuration for the kamitext C header.
#
# Regenerate with:
#   ~/.cargo/bin/cbindgen --config cbindgen.toml --crate kamitext --output include/kami_core.h

language = "C"
include_guard = "KAMI_CORE_H"
autogen_warning = "/* Generated by cbindgen from kamitext; do not edit by hand. */"
documentation = true
documentation_style = "c99"
cpp_compat = true
usize_is_size_t = true

header = """/*
 * kamitext C ABI.
 *
 * Check kami_abi_version() before use. All query results point into
 * engine-owned arenas and are invalidated by ANY subsequent call on the same
 * engine — copy out what you need before calling again or yielding control.
 * Strings are (ptr, len) UTF-8, never NUL-terminated.
 */"""

[export]
include = [
    "KamiEngine",
    "KamiOptions",
    "KamiByteRange",
    "KamiSegment",
    "KamiElement",
    "KamiStr",
    "KamiSegments",
    "KamiElements",
    "KamiPatch",
    "KamiEditOp",
    "KamiEditPlan",
]

[parse]
parse_deps = false
